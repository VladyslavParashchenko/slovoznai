<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2f2" />
    <script>
      ;(() => {
        const media = matchMedia("(prefers-color-scheme: dark)")
        const apply = () => {
          let saved = null
          try {
            saved = localStorage.getItem("slovoznai:theme")
          } catch {}
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : media.matches
                ? "dark"
                : "light"
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "dark" ? "#252525" : "#f2f2f2")
        }
        apply()
        media.addEventListener("change", apply)
      })()
    </script>
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body>
    <noscript>Для гри «Словознай» увімкніть JavaScript.</noscript>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
